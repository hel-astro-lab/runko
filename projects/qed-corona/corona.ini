# The hard-state pair corona of Nattila (2024): heated and injected pairs in a magnetized slab,
# every photon self-made (synchrotron, self-absorbed, Comptonized, pair-producing), photons escaping.

[io]
io_outdir: "corona"          # output directory
io_record_interval: 10       # laps between diagnostic records
io_verbose_interval: 500     # laps between progress lines

[grid]
n_tiles: [1, 1, 1]
n_cells_per_tile: [64, 64, 64]   # the tile is the reaction cell; cubic

[simulation]
cfl: 0.064                   # dt = cfl/n_cells crossings of the tile: 1e-3
n_cross: 10.0                # run length in light crossings

[particles]
q0: -1                       # electrons
m0: 1
w0: 1e-3                     # lepton LP weight in Thomson depths (w_lep)
q1: 1                        # positrons
m1: 1
w1: 1e-3
q2: 0                        # photons: massless, per-particle weights
m2: 0
n_payload2: 1                # the photon weight is payload component 0

[problem]
H_cm: 9e6                    # slab size, cm (0.3 x 3e7 cm)
tau0: 1.0                    # initial pair depth
theta0: 0.5                  # initial lepton temperature
ell_th: 7.0                  # diffusive heating compactness
ell_nth: 1.0                 # power-law pair injection compactness
p_inj: 6.0                   # its slope
g_inj: [3.0, 30.0]           # its range in gamma
qed_ell_B: 0.8               # magnetic compactness
qed_x_min: 5e-6              # floor of the synchrotron band, a few times below x_SSA

[algorithms]
field_propagator:   "fdtd2"
particle_pusher:    ["boris", "boris", "ballistic"]   # one per species: photons stream
field_interpolator: "linear_1st"
current_depositer:  "zigzag_1st"
tile_partitioning:  "hilbert_curve"
qed_nbin: 16                 # energy bins per reaction cell and species
qed_n_reaction_cells: 1      # reaction sub-cells per tile edge
qed_nsort: 10                # steps between padded sorts
qed_slack: 0.5               # slack slots per key, fraction of its live LPs
qed_smin: 4
qed_a_res: 0.7               # photon LPs per unit weight ~ (x/x_ref)^a
qed_x_ref: 1e-5              # anchored at the seed energy
qed_n_cap: 32
qed_acc_syn: 3.0
qed_kappa_acc: 0.1
qed_nsub_max: 8
qed_seed: 1
