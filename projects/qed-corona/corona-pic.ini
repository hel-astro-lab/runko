# The pair corona inside the PIC loop: a periodic box of 2x2x2 tiles driven by the Langevin
# antenna, the QED channels on the local field, photons escaping through the slab sink.

[io]
io_outdir: "corona-pic"
io_output_interval: 100      # laps between field, particle and spectra snapshots
io_qed_interval: 20          # laps between QED diagnostic records
io_verbose_interval: 100     # laps between progress lines
io_grid_stride: 1
io_n_sampled_prtcls: 20000   # particles per species in a snapshot
io_n_spectra_bins: 100
io_spectra_umin: 1e-5
io_spectra_umax: 1e3

[grid]
n_tiles: [2, 2, 2]
n_cells_per_tile: [32, 32, 32]

[simulation]
cfl: 0.45
n_cross: 3.0                 # run length in light crossings of the box

[particles]
ppc: 2                       # macro-particles per cell per lepton species
m0: 1                        # electrons: charge from the skin depth below
m1: 1                        # positrons
theta0: 0.3                  # initial lepton temperature kT/(m c^2)
theta1_to_theta0: 1
q2: 0                        # photons: massless, per-particle weights
m2: 0

[problem]
sigma: 1.0                   # magnetization of the mean field
n_cells_per_skindepth: 1
modes_par: 1                 # antenna modes along and across the mean field
modes_perp: 1
fixed_antenna: False
n_filter_passes: 8
H_cm: 9e6                    # box edge, cm
tau0: 1.0                    # initial pair depth of the box
qed_ell_B: 0.8               # magnetic compactness of the mean field over the box edge
qed_x_min: 5e-6              # floor of the synchrotron band

[algorithms]
field_propagator:   "fdtd2"
particle_pusher:    "boris"
field_interpolator: "linear_1st"
current_depositer:  "zigzag_1st_atomic"
current_filter:     "binomial2_unrolled"
tile_partitioning:  "hilbert_curve"
qed_nbin: 16
qed_n_reaction_cells: 1
qed_nsort: 10
qed_slack: 0.5
qed_smin: 4
qed_a_res: 0.7
qed_x_ref: 1e-5
qed_n_cap: 32
qed_acc_syn: 3.0
qed_kappa_acc: 0.1
qed_nsub_max: 8
qed_seed: 1
