[io]
io_outdir:  "auto"
io_outdir_prefix:  "3d_dec_"
io_outdir_postfix: "_v1"
io_output_interval: 20
io_n_sampled_prtcls: 2000
io_grid_stride: 1
io_n_spectra_bins: 256    # [pspectra] number of bins for particle spectra
io_spectra_stride: 160    # [pspectra] x-binning; >= n_cells_per_tile[0] gives one spectrum 
io_spectra_umin:  1e-2    # [pspectra] lower u boundary (log10 scale)
io_spectra_umax:  1e3     # [pspectra] upper u boundary (log10 scale)

[grid]
n_tiles: [1, 1, 1]
n_cells_per_tile: [160, 160, 160]

[simulation]
cfl: 0.45
n_eddy_turnovers: 5   # sim length in light crossing times of the driving-scale eddy l_0

[particles]
ppc: 2                # particles per cell per species
m0: 1
m1: 1
theta0: 0.3
theta1_to_theta0: 1

[problem]
sigma: 1       # electron cold magnetization (species 0)
n_cells_per_skindepth: 1
n_filter_passes: 4

use_antenna: False    # True: driven by Langevin antenna; False: decaying initial Bperp
Bperp_to_B0: 1.0      # delta B_perp / B_0 perturbation amplitude
modes_perp: 3         # perpendicular mode number of perturbation 
modes_par: 2          # parallel mode number of perturbation

[algorithms]
field_propagator:   "fdtd2"
particle_pusher:    "boris"
field_interpolator: "linear_1st"
current_depositer:  "zigzag_1st_atomic"
current_filter:     "binomial2_unrolled"
tile_partitioning:  "hilbert_curve"
